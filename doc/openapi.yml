openapi: 3.1.0
info:
  title: Cinema Management API
  description: >
    Shared contract for the movie theater management project.
    Infrastructure & Identity Module (Valisoa): User, Room, Seat.
    Catalog & Reservation Module (Zinedis): Movie, Screening, Reservation.
  version: 1.0.0
servers:
  - url: 'https://localhost:8080'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '403':
      description: Insufficient role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '429':
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    UserRole:
      type: string
      enum: [CLIENT, EMPLOYEE, MANAGER]

    Genre:
      type: string
      enum: [THRILLER, ROMANCE, COMEDY, DRAMA, ACTION, SCI_FI, FANTASY, ANIMATION]