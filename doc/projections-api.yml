paths:
  /projections:
    get:
      tags: [Projections]
      operationId: listProjections
      description: 200 for every role, public included.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Projection'
        '429':
          $ref: './openapi.yml#/components/responses/429'
        '500':
          $ref: './openapi.yml#/components/responses/500'
    put:
      tags: [Projections]
      operationId: upsertProjection
      description: 403 for CLIENT and EMPLOYEE, 200 for MANAGER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectionInput'
      responses:
        '200':
          description: Projection created/updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projection'
        '401':
          $ref: './openapi.yml#/components/responses/401'
        '403':
          $ref: './openapi.yml#/components/responses/403'
        '429':
          $ref: './openapi.yml#/components/responses/429'
        '500':
          $ref: './openapi.yml#/components/responses/500'

  /projections/{id}:
    get:
      tags: [Projections]
      operationId: getProjectionById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projection'
        '404':
          $ref: './openapi.yml#/components/responses/404'
        '429':
          $ref: './openapi.yml#/components/responses/429'
        '500':
          $ref: './openapi.yml#/components/responses/500'

components:
  schemas:
    Projection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        movieId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        datetime:
          type: string
          format: date-time
        seatPrice:
          type: number
          format: decimal

    ProjectionInput:
      type: object
      required: [movieId, roomId, datetime, seatPrice]
      properties:
        movieId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        datetime:
          type: string
          format: date-time
        seatPrice:
          type: number
          format: decimal