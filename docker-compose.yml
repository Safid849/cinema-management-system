services:
  db:
    image: postgres:16-alpine
    container_name: cinema-db
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    ports:
      - "5432:5432"
    volumes:
      - cinema-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinema-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql://db:5432/cinema
      DB_USERNAME: cinema
      DB_PASSWORD: cinema
      JWT_SECRET: ${JWT_SECRET:-dGVzdF9zZWNyZXRfa2V5X2Zvcl9kZXZlbG9wbWVudF9vbmx5XzEyMzQ1Njc4OTA=}
      # First run only: creates the MANAGER that can then promote everyone else.
      CINEMA_BOOTSTRAP_ENABLED: ${CINEMA_BOOTSTRAP_ENABLED:-true}
      CINEMA_BOOTSTRAP_EMAIL: ${CINEMA_BOOTSTRAP_EMAIL:-manager@cinema.local}
      CINEMA_BOOTSTRAP_PASSWORD: ${CINEMA_BOOTSTRAP_PASSWORD:-changeit}
    ports:
      - "8080:8080"

volumes:
  cinema-db-data: