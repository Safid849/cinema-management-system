spring.config.import=optional:file.env[.properties]

spring.datasource.url=jdbc:${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true

# The default secret only exists so the app boots locally. Set JWT_SECRET in
# every real environment: it is a base64 string of at least 32 bytes.
jwt.secret=${JWT_SECRET:dGVzdF9zZWNyZXRfa2V5X2Zvcl9kZXZlbG9wbWVudF9vbmx5XzEyMzQ1Njc4OTA=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Public sign-up always creates a CLIENT, so a fresh database has nobody able to
# grant roles. Turn this on once to create the first MANAGER, then turn it off.
cinema.bootstrap.enabled=${CINEMA_BOOTSTRAP_ENABLED:false}
cinema.bootstrap.email=${CINEMA_BOOTSTRAP_EMAIL:manager@cinema.local}
cinema.bootstrap.password=${CINEMA_BOOTSTRAP_PASSWORD:changeit}
